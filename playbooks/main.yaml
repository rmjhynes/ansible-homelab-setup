---
- name: Configure homelab
  hosts: myhosts
  pre_tasks:
    - name: Verify ANSIBLE_MULLVAD_ACCOUNT_NUMBER environment variable is set
      ansible.builtin.assert:
        that:
          - mullvad_account_number is defined
          - mullvad_account_number | length > 0
        fail_msg: |
          ERROR: ANSIBLE_MULLVAD_ACCOUNT_NUMBER environment variable is not set.

          The VPN role requires this variable to authenticate with Mullvad VPN.
          Please set it before running this playbook:

            export ANSIBLE_MULLVAD_ACCOUNT_NUMBER=<your_account_number>

          Or run the playbook with:

            ANSIBLE_MULLVAD_ACCOUNT_NUMBER=<your_account_number> ansible-playbook playbooks/main.yaml
        success_msg: "ANSIBLE_MULLVAD_ACCOUNT_NUMBER environment variable is set - proceeding..."

    # Installers use this instead of fixed /tmp paths that other local users could plant malicious files at
    - name: Create private temp directory for installers
      ansible.builtin.tempfile:
        state: directory
      register: tmp_install_dir
      changed_when: false
  roles:
    - dnf
    - external_packages
    - k3d_podman
    - system_config
    - git
    - dotfiles
    - k3s
    - flatpak
    - vpn
    - tailscale
    - systemd
  post_tasks:
    - name: Remove private temp directory
      ansible.builtin.file:
        path: "{{ tmp_install_dir.path }}"
        state: absent
      changed_when: false
