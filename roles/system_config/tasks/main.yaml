- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ hostname }}"
    use: systemd

- name: Set time zone
  become: true
  community.general.timezone:
    name: "{{ timezone }}"

- name: Check current locale
  ansible.builtin.command: localectl status
  register: locale_status
  changed_when: false
  failed_when: locale_status.rc != 0

- name: Set system locale if needed
  ansible.builtin.command: localectl set-locale LANG={{ locale }}
  changed_when: "'locale' not in locale_status.stdout"

- name: Check if /usr/local/bin exists
  ansible.builtin.stat:
    path: /usr/local/bin
  register: local_bin_dir

- name: Create /usr/local/bin if it doesn't exist
  become: true
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: '0755'
  when: not local_bin_dir.stat.exists

- name: Install packages with zypper
  become: true
  community.general.zypper:
    name: "{{ item }}"
    state: present
  loop:
    - docker
    - figlet
    - flatpak
    - git
    - htop
    - zsh

- name: Set rmjhynes shell to zsh
  become: true
  ansible.builtin.user:
    name: rmjhynes
    shell: /bin/zsh

- name: Create message of the day file
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/motd.sh
    content: |
      #!/bin/bash
      figlet -f larry3d Homelab
    mode: "0755"
