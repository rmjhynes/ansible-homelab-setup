- name: Print the home directory for each host
  ansible.builtin.debug:
    msg: "Home dir: {{ ansible_facts['env']['HOME'] }}"

- name: Checkout dotfiles repo
  ansible.builtin.git:
    repo: "https://{{ github_username }}@github.com/{{ github_username }}/dotfiles.git"
    version: main
    dest: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
    force: true

- name: Checkout devcontainer repo
  ansible.builtin.git:
    repo: "https://{{ github_username }}@github.com/{{ github_username }}/dotfiles-devpod.git"
    version: main
    dest: "{{ ansible_facts['env']['HOME'] }}/repos/dotfiles-devpod"
    force: true

- name: Determine machine architecture
  ansible.builtin.set_fact:
    machine_arch: "{{ 'amd64' if ansible_facts['architecture'] in ['x86_64'] else 'arm64' }}"

- name: Print machine architecture
  ansible.builtin.debug:
    msg: "Machine architecture: {{ machine_arch }}"

- name: Install DevPod CLI
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/loft-sh/devpod/releases/latest/download/devpod-linux-{{ machine_arch }}"
    dest: /usr/local/bin/devpod
    mode: '0755'

- name: Get DevPod CLI version
  ansible.builtin.command: /usr/local/bin/devpod version
  register: devpod_version
  changed_when: false

- name: Print DevPod CLI version
  ansible.builtin.debug:
    msg: "DevPod CLI version: {{ devpod_version.stdout_lines }}"
