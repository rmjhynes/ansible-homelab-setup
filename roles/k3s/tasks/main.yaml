- name: Check if /usr/local/bin exists
  stat:
    path: /usr/local/bin
  register: local_bin_dir

- name: Create /usr/local/bin if it doesn't exist
  become: yes
  file:
    path: /usr/local/bin
    state: directory
    mode: '0755'
  when: not local_bin_dir.stat.exists

- name: Install k3s
  become: yes
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: chmod kube config file for sudo-less kubectl
  become: yes
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Verify K3s is running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: yes

- name: Get cluster info
  command: /usr/local/bin/kubectl cluster-info
  register: cluster_info
  changed_when: false

- name: Display cluster info
  debug:
    var: cluster_info.stdout_lines
