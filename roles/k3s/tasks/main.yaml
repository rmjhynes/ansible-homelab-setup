- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'

- name: Run K3s install script
  become: true
  ansible.builtin.command: sh /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s

- name: Verify K3s is running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Get K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_version
  changed_when: false

- name: Display K3s version
  ansible.builtin.debug:
    var: k3s_version.stdout_lines

- name: Get cluster info
  ansible.builtin.command: /usr/local/bin/kubectl cluster-info
  register: cluster_info
  changed_when: false

- name: Display cluster info
  ansible.builtin.debug:
    var: cluster_info.stdout_lines

- name: Create .kube directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0755'

- name: Copy k3s kubeconfig to user config
  become: true
  ansible.builtin.shell: k3s kubectl config view --raw > "{{ ansible_env.HOME }}/.kube/config"
  args:
    creates: "{{ ansible_env.HOME }}/.kube/config"

- name: Set kubeconfig permissions
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube/config"
    mode: '0600'
