- name: Set hostname
  become: yes
  ansible.builtin.hostname:
    name: "{{ hostname }}"
    use: systemd

- name: Set time zone
  become: yes
  ansible.builtin.timezone:
    name: "{{ timezone }}"

- name: Set system locale
  ansible.builtin.command: localectl set-locale LANG={{ locale }}

- name: Create message of the day file
  become: yes
  ansible.builtin.copy:
    dest: /etc/profile.d/motd.sh
    content: |
      #!/bin/sh
      ~/.nix-profile/bin/figlet -f larry3d Homelab
    mode: "0755"
