[defaults]
roles_path = ./roles
inventory = ./inventory.yaml
callbacks_enabled = timer, profile_tasks, profile_roles

# Suppress Python interpreter discovery warnings
interpreter_python = auto_silent
# Use cached facts if available - only re-gather when cache expires
gathering = smart
# Store facts as JSON files on disk
fact_caching = jsonfile
# Directory for cached fact files
fact_caching_connection = ~/.ansible/fact_cache
# Cache expires after 8 hours (in seconds)
fact_caching_timeout = 28800

[ssh_connection]
# Pipe modules directly to Python over SSH instead of copying files
pipelining = True
# Reuse SSH connections for 60s to reduce handshake overhead
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[privilege_escalation]
# Always prompt for sudo password (equivalent to -K flag)
become_ask_pass = True
